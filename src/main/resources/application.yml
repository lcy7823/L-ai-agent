spring:
  application:
    name: L-ai-agent
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
  ai:
    vectorstore:
      pgvector:
        index-type: hnsw
        dimensions: 1536
        distance-type: cosine_distance
        max-document-batch-size: 1000
    mcp:
      client:
        toolcallback:
          enabled: true
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127

        stdio:
          servers-configuration: classpath:mcp-servers.json




server:
  port: 8123
  servlet:
    context-path: /api


# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.kaoyu.laiagent.controller
# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn



